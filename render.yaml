services:
  - type: web
    name: checkfakereviews
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app_render:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: DEMO_FALLBACK
        value: "0"
      - key: WORKER_TOKEN
        sync: false
